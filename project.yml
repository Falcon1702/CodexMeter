name: WatchOverlay

options:
  bundleIdPrefix: com.example.codexmeter
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ENABLE_DEBUG_DYLIB: false
    CODE_SIGN_STYLE: Automatic

packages:
  UsageCore:
    path: Packages/UsageCore
  WatchUI:
    path: Packages/WatchUI

targets:
  WatchOverlay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS
      - path: Apps/iOSShared
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: CodexMeter
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.codexmeter.refresh
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: CodexMeter verbindet sich mit deinem lokalen Codex-Bridge-Dienst, um die aktuellen Nutzungslimits zu laden.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Apps/iOS/WatchOverlay.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.codexmeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmeter
        PRODUCT_NAME: CodexMeter
        INFOPLIST_KEY_CFBundleDisplayName: CodexMeter
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: UsageCore
      - package: WatchUI
      - target: WatchOverlayWatch
        embed: true
      - target: WatchOverlayPhoneWidget
        embed: true

  WatchOverlayPhoneWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOSWidget
      - path: Apps/iOSShared
    info:
      path: Apps/iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: CodexMeter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/iOSWidget/WatchOverlayPhoneWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.codexmeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmeter.widget
        PRODUCT_NAME: Codex Usage
        SKIP_INSTALL: true
    dependencies:
      - package: UsageCore
      - package: WatchUI

  WatchOverlayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/WatchApp
      - path: Apps/WatchShared
    info:
      path: Apps/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: CodexMeter
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.codexmeter
    entitlements:
      path: Apps/WatchApp/WatchOverlayWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.codexmeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmeter.watchkitapp
        PRODUCT_NAME: CodexMeter
        INFOPLIST_KEY_CFBundleDisplayName: CodexMeter
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: UsageCore
      - package: WatchUI
      - target: WatchOverlayWidget
        embed: true

  WatchOverlayWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/WatchWidget
      - path: Apps/WatchShared
    info:
      path: Apps/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: CodexMeter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/WatchWidget/WatchOverlayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.codexmeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.codexmeter.watchkitapp.widget
        PRODUCT_NAME: Usage Complication
        SKIP_INSTALL: true
    dependencies:
      - package: UsageCore
      - package: WatchUI

schemes:
  WatchOverlay:
    build:
      targets:
        WatchOverlay: all
    run:
      config: Debug
    archive:
      config: Release

  WatchOverlayWatch:
    build:
      parallelizeBuild: false
      targets:
        WatchOverlayWatch: all
    run:
      config: Debug
