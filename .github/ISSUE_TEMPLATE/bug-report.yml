name: Bug report
description: Report a reproducible CodexMeter problem without account secrets.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, device codes, account identifiers, `auth.json`,
        bridge secrets, or raw OpenAI responses. Use the private security path
        from `SECURITY.md` for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized or demo data only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: CodexMeter revision
      description: Commit SHA, branch, or release identifier.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and software versions
      description: Name the affected app surface and OS major version only. Do not include device names, serial numbers, Apple IDs, or personal identifiers.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add only the minimum relevant excerpt after removing private data, local paths, hostnames, and account details.
